version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: aegis_backend
    ports:
      - "8000:8000"
    environment:
      - AEGIS_DEVICE=auto
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: aegis_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

